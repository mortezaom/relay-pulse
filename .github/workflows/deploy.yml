name: 🚀 Deploy Relay Pulse

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  # Global auth for all steps
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: 🛑 Check Credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "❌ Error: Missing Cloudflare Credentials in GitHub Secrets"
          exit 1

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔧 Build App
        env:
          CI: true
        run: |
          pnpm build
          npx opennextjs-cloudflare build

      - name: ⚙️ Setup Cloudflare (Resources & Secrets)
        run: node scripts/setup-env.js
        env:
          RELAY_AUTH_EMAIL: ${{ secrets.RELAY_AUTH_SECRET }}
          RELAY_AUTH_SECRET: ${{ secrets.RELAY_AUTH_SECRET }}
          RELAY_JWT_SECRET: ${{ secrets.RELAY_JWT_SECRET }}

      - name: 🗄️ Database Migrations
        run: npx wrangler d1 migrations apply relay-pulse-db --remote

      - name: 🚀 Deploy
        run: npx opennextjs-cloudflare deploy

      - name: ✅ Health Check
        run: |
          echo "⏳ Waiting 15s for cold start..."
          sleep 15
          
          # Get URL dynamically
          WORKER_URL=$(npx wrangler deployments list --name relay-pulse --json | jq -r '.[0].url' || echo "")
          
          if [ -z "$WORKER_URL" ] || [ "$WORKER_URL" == "null" ]; then
             echo "⚠️ Could not auto-detect URL. Check Cloudflare Dashboard."
          else
             echo "📍 App deployed to: $WORKER_URL"
             echo "🔍 Checking /api/health..."
             curl -s -f "$WORKER_URL/api/health" || echo "Health check pending (normal for fresh deploy)"
          fi